name: Release

# Publishes to PyPI when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires a repository secret PYPI_API_TOKEN (a PyPI API token scoped to this
# project, or account-wide for the first release). Create it at
# https://pypi.org/manage/account/token/ and add it under
# Settings -> Secrets and variables -> Actions.
#
# Alternative: PyPI Trusted Publishing (OIDC, no secret) -- drop `with.password`
# below and configure a trusted publisher for this repo on PyPI instead.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
