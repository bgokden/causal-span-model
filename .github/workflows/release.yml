name: Release

# Publishes to PyPI. Manual and main-only: from the Actions tab, run "Release"
# with the `main` branch selected. The job targets the `pypi` environment (whose
# "protected branches only" policy plus the main-only guard below means only main
# can deploy) and reads the PYPI_API_TOKEN secret from that environment.
#
# The published version is whatever is in pyproject.toml -- bump it on main before
# running. Tag-triggered releases are intentionally not used: a tag ref is not a
# branch, so it cannot satisfy the environment's protected-branches policy.

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
