[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-span-model"
version = "0.1.2"
description = "Multilingual BIO span tagger for cause/effect/signal, consumed by reasongraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Berk Gokden", email = "berkgokden@gmail.com"},
]
keywords = [
    "causal-extraction", "token-classification", "bio-tagging", "nlp",
    "multilingual", "mdeberta-v3", "onnx", "reasongraph",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base install is inference-only (what reasongraph consumes): the pointer model
# loads and predicts with just torch + transformers (sentencepiece/protobuf are the
# mDeBERTa tokenizer runtime deps). Training/eval/export pull heavier packages via
# the extras below, so `pip install causal-span-model` stays lean.
dependencies = [
    "transformers>=4.44",
    "torch>=2.1",
    "sentencepiece>=0.1.99",
    "protobuf>=4.21",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Training, dataset prep, and submission/eval scoring.
train = [
    "datasets>=2.14",
    "seqeval>=1.2",
    "accelerate>=0.26",
    "pandas>=2.0",
]
onnx = [
    "optimum[onnxruntime]>=1.17",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
dev = [
    "causal-span-model[train,onnx]",
    "pytest>=7.4",
]

[project.scripts]
cnc-to-bio = "causal_span_model.cnc_to_bio:main"
causal-translate = "causal_span_model.translate:main"
causal-train = "causal_span_model.train:main"
causal-export-onnx = "causal_span_model.export_onnx:main"
causal-evaluate = "causal_span_model.evaluate:main"
causal-infer = "causal_span_model.infer:main"
causal-card = "causal_span_model.model_card:main"
causal-push = "causal_span_model.push_to_hub:main"
causal-pointer-train = "causal_span_model.pointer.train:main"
causal-pointer-submit = "causal_span_model.pointer.submission:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_span_model"]

[tool.hatch.build.targets.sdist]
# Ship the package, tests, and metadata only -- keep scratch (tmp/), local run
# scripts, and CI config out of the published source distribution.
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
